
apiVersion: apps/v1
kind: Deployment

metadata:
  name: static-site
  namespace: demo
  labels:
    app: static-site

spec:
  replicas: 4

  selector:
    matchLabels:
      app: static-site

  template:
    metadata:
      labels:
        app: static-site

    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

